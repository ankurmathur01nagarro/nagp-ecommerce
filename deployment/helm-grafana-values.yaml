# Grafana Helm Values for Observability Stack
# Provides unified UI for Loki (logs), Jaeger (traces), and Prometheus (metrics)

# Disable authentication for local development
adminUser: admin
adminPassword: admin

# Pre-configure all observability data sources
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        jsonData:
          maxLines: 1000

      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        isDefault: false

      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server:80
        isDefault: true

# Lightweight resource limits for local k3d
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Single replica for local dev
replicas: 1

# Persistence disabled for local dev
persistence:
  enabled: false

# Service type
service:
  type: ClusterIP
  port: 3000
