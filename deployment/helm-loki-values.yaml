# Loki 3.x Helm Chart Values - with OTLP log ingestion support
# Chart: grafana/loki (standalone)
# Requires: Loki 3.x for native OTLP support

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  # Enable OTLP log ingestion (Loki 3.x feature)
  limits_config:
    allow_structured_metadata: true

# SingleBinary deployment
singleBinary:
  replicas: 1
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi

# Disable components not needed for SingleBinary
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Disable self-monitoring and test
lokiCanary:
  enabled: false
test:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

# Disable minio/gateway - use filesystem
minio:
  enabled: false
gateway:
  enabled: false

# ChunksCache and resultsCache
chunksCache:
  enabled: false
resultsCache:
  enabled: false
