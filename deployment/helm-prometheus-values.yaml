# Prometheus Helm Chart Values - Alloy Integration
# Chart: prometheus-community/prometheus (v28.9.0)
# Ref: https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus/values.yaml

server:
  extraArgs:
    enable-feature: metadata-wal-records

  # Convert classic histograms to Native Histograms with Custom Buckets (NHCB)
  # at scrape time. Useful for any remaining scrape targets that expose classic
  # histograms. Harmless when no classic-only targets remain.
  # Ref: https://prometheus.io/docs/prometheus/latest/configuration/configuration/#scrape_config
  global:
    convert_classic_histograms_to_nhcb: true

  # Resource limits (P1-2)
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  # Retention — first-class Helm values (auto-converted to CLI flags)
  # Ref: https://prometheus.io/docs/prometheus/latest/storage/#operational-aspects
  retention: "15d"
  retentionSize: "8GB"

  # Remote Write configuration to Grafana Alloy
  # Alloy's prometheus.receive_http component uses standard Prometheus v1 protocol
  # (no protobuf_message override needed — unlike the old OTel prometheusremotewrite
  # receiver which required v2).
  # Endpoint path changed: /api/v1/write → /api/v1/metrics/write (Alloy convention).

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

# Disabled — Kiali handles Istio traffic visualization; k8s node/pod metrics
# not needed in the observability pipeline. Can be re-enabled later when a
# dedicated Kubernetes dashboard tool is implemented.
prometheus-node-exporter:
  enabled: false

kube-state-metrics:
  enabled: false

# Full config override to disable scraping and only remote_write to Alloy.
serverFiles:
  prometheus.yml: |
    global:
      evaluation_interval: 30s
      scrape_interval: 30s
      scrape_timeout: 10s
      convert_classic_histograms_to_nhcb: true

    alerting:
      alertmanagers: []

    rule_files: []

    scrape_configs: []

    remote_write:
      - url: http://alloy.observability:9090/api/v1/metrics/write
        write_relabel_configs:
          - source_labels: [job]
            regex: "prometheus|kubernetes-.*|kube-.*|kubelet.*|apiserver|coredns|node-exporter"
            action: drop

rbac:
  create: true
