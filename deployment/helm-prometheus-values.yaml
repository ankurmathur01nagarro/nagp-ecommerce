# Prometheus Helm Chart Values - OTel Integration
# Chart: prometheus-community/prometheus (v28.9.0)
# Ref: https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus/values.yaml

server:
  extraArgs:
    enable-feature: metadata-wal-records

  # Convert classic histograms to Native Histograms with Custom Buckets (NHCB)
  # at scrape time. Most k8s targets (kubelet, apiserver, scheduler etc.) only
  # expose classic histograms, but the OTel prometheusremotewrite receiver only
  # supports native histograms.  Without this, classic series are parsed then
  # dropped with thousands of "Dropping classic histogram" warnings.
  # Ref: https://prometheus.io/docs/prometheus/latest/configuration/configuration/#scrape_config
  global:
    convert_classic_histograms_to_nhcb: true

  # Resource limits (P1-2)
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  # Retention — first-class Helm values (auto-converted to CLI flags)
  # Ref: https://prometheus.io/docs/prometheus/latest/storage/#operational-aspects
  retention: "15d"
  retentionSize: "8GB"

  # Remote Write configuration to OTel Collector
  # protobuf_message: OTel prometheusremotewrite receiver (v0.142.0+) only supports Remote Write v2.
  # Without this setting Prometheus defaults to v1 (prometheus.WriteRequest) which is rejected.
  remoteWrite:
    - url: http://otel-opentelemetry-collector.observability:9090/api/v1/write
      protobuf_message: "io.prometheus.write.v2.Request"
      # Native histograms are sent automatically with v2 protocol (send_native_histograms is noop).
      # Classic→NHCB conversion is handled by global.convert_classic_histograms_to_nhcb above.

      # Suppress "metadata_config.send is redundant" WARN — with Remote Write v2,
      # metadata is always gathered from the WAL and included in every request.
      metadata_config:
        send: false

      # Only remote-write K8s infrastructure and application metrics.
      # Drop Prometheus self-monitoring (job="prometheus") — 700+ series of
      # internal engine/tsdb/WAL metrics that are not relevant to K8s or app
      # observability. This also eliminates the "failedSampleCount" ERROR
      # caused by summary metrics the OTel receiver cannot translate.
      write_relabel_configs:
        - source_labels: [job]
          regex: "prometheus"
          action: drop

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true

rbac:
  create: true
