# Grafana Alloy Helm Chart Values
# Chart: grafana/alloy (v1.6.0, AppVersion v1.13.0)
# Replaces: opentelemetry-collector (helm-otel-values.yaml)
# Ref: https://grafana.com/docs/alloy/latest/set-up/install/kubernetes/
# Ref: https://github.com/grafana/alloy/releases/tag/v1.13.0

controller:
  type: deployment
  replicas: 1

alloy:
  stabilityLevel: "generally-available"

  configMap:
    # Use externally provided ConfigMap (single ArgoCD app with extra source)
    create: false
    name: alloy
    key: config.alloy

  # Extra ports exposed on the Alloy pod and service
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  # Environment variables (same secrets as previous OTel Collector config)
  extraEnv:
    - name: NEW_RELIC_API_KEY
      valueFrom:
        secretKeyRef:
          name: newrelic-otel-secret
          key: api-key
    # GOMEMLIMIT recommended by OTel/Alloy docs — set to match memory_limiter.limit
    - name: GOMEMLIMIT
      value: "400MiB"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
