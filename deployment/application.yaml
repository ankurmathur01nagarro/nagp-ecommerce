apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nagp-ecom-gateway
  namespace: default
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nagp-ecom
  namespace: argocd
spec:
  destinations:
  - name: defaultCluster
    namespace: nagp-ecom
    server: https://kubernetes.default.svc
  sourceRepos:
  - https://github.com/ankurmathur01nagarro/nagp-ecommerce
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nagp-ecom-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ankurmathur01nagarro/nagp-ecommerce
    targetRevision: HEAD
    path: deployment/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: nagp-ecom
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
