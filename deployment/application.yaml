apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nagp-ecom-gateway
  namespace: nagp-ecom
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
# AppProject for microservice applications
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nagp-ecom
  namespace: argocd
spec:
  destinations:
  - name: defaultCluster
    namespace: nagp-ecom
    server: https://kubernetes.default.svc
  sourceRepos:
  - https://github.com/ankurmathur01nagarro/nagp-ecommerce
---
# AppProject for observability stack (separate for security isolation)
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
spec:
  destinations:
  - name: defaultCluster
    namespace: observability
    server: https://kubernetes.default.svc
  - name: defaultCluster
    namespace: istio-system
    server: https://kubernetes.default.svc
  # Allow cluster-scoped resources (ClusterRole, ClusterRoleBinding created by Helm charts)
  - name: defaultCluster
    namespace: '*'
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  sourceRepos:
  - '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nagp-ecom-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ankurmathur01nagarro/nagp-ecommerce
    targetRevision: HEAD
    path: deployment/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: nagp-ecom
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
