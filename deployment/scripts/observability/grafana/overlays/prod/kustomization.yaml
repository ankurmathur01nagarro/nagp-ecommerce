apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: grafana-staging

# PVC config for staging environment
resources:
  - ../../base

# Override PVC storage class for cloud staging
patches:
  - target:
      kind: PersistentVolumeClaim
      name: grafana-storage
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: standard
      - op: replace
        path: /spec/resources/requests/storage
        value: 5Gi

commonLabels:
  environment: staging
