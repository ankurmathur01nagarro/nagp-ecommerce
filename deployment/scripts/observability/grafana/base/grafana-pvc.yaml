apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # LOCAL: Use local-path (k3d default, ephemeral temp folders)
  storageClassName: local-path
  # For overlays: Override storageClassName via kustomize patches for staging/prod
