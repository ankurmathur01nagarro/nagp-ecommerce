apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: grafana

# Include the PVC manifest
resources:
  - grafana-pvc.yaml

# Deploy Grafana Helm chart
helmCharts:
  - name: grafana
    repo: https://grafana-community.github.io/helm-charts
    releaseName: grafana
    version: "10.5.15"
    namespace: observability
    valuesFile: helm-grafana-values.yaml
