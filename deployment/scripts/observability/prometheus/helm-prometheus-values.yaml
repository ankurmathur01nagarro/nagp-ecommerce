# Prometheus Helm Chart Values - Alloy Integration
# Chart: prometheus-community/prometheus (v28.9.0)
# Ref: https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus/values.yaml

server:
  extraArgs:
    enable-feature: "metadata-wal-records,remote-write-receiver"

  # Convert classic histograms to Native Histograms with Custom Buckets (NHCB)
  # at scrape time. Useful for any remaining scrape targets that expose classic
  # histograms. Harmless when no classic-only targets remain.
  # Ref: https://prometheus.io/docs/prometheus/latest/configuration/configuration/#scrape_config
  global:
    convert_classic_histograms_to_nhcb: true
    evaluation_interval: 30s
    scrape_interval: 30s
    scrape_timeout: 10s

  # Resource limits (P1-2)
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  # Retention — first-class Helm values (auto-converted to CLI flags)
  # Ref: https://prometheus.io/docs/prometheus/latest/storage/#operational-aspects
  retention: "15d"
  retentionSize: "8GB"



alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

# Node-level CPU/memory/disk/network metrics via DaemonSet.
# Scraped by the node-exporter job defined in scrape_configs below.
prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: false

# Use chart-default scrapeConfigs — includes kubelet, cAdvisor, node-exporter,
# kubernetes-service-endpoints, kubernetes-pods, etc. Jobs with no matching
# targets are harmless (0 active targets).

rbac:
  create: true
