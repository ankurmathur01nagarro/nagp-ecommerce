csiDriver:
  name: org.democratic-csi.nfs

driver:
  existingConfigSecret: democratic-csi-nfs-config

node:
  hostPID: true
  driver:
    extraEnv:
      - name: NFS_MOUNT_STRATEGY
        value: nsenter
      - name: NFS_MOUNT_PATH
        value: /sbin/mount.nfs

storageClasses: []

resources:
  limits:
    memory: 128Mi
  requests:
    memory: 64Mi
    cpu: 20m