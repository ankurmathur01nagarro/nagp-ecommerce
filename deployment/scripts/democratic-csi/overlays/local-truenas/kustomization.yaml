apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Secrets are generated by kustomize from driver config files written at deploy time.
# The config-*.yaml files are gitignored and written by create_cluster.py before kustomize runs.
secretGenerator:
  - name: democratic-csi-iscsi-config
    namespace: democratic-csi
    files:
      - driver-config-file.yaml=config-iscsi.yaml
    options:
      disableNameSuffixHash: true

  - name: democratic-csi-nfs-config
    namespace: democratic-csi
    files:
      - driver-config-file.yaml=config-nfs.yaml
    options:
      disableNameSuffixHash: true

helmCharts:
  # iSCSI driver → sc-block
  - name: democratic-csi
    repo: https://democratic-csi.github.io/charts/
    version: 0.14.6
    releaseName: democratic-csi-iscsi
    namespace: democratic-csi
    valuesFile: values-iscsi.yaml

  # NFS driver → sc-shared
  - name: democratic-csi
    repo: https://democratic-csi.github.io/charts/
    version: 0.14.6
    releaseName: democratic-csi-nfs
    namespace: democratic-csi
    valuesFile: values-nfs.yaml