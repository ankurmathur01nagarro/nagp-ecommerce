# Grafana Helm Values for Observability Stack
# Chart: grafana-community/grafana (migrated from grafana/grafana after Jan 30, 2026)
# Ref: https://github.com/grafana-community/helm-charts
# Provides unified UI for Loki (logs), Jaeger (traces), and Prometheus (metrics)

# Admin credentials via Kubernetes secret (P1-7: do NOT hardcode in values)
# Create secret: kubectl create secret generic grafana-admin-secret --from-literal=admin-user=admin --from-literal=admin-password=<strong-password> -n observability
admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password

# Pre-configure all observability data sources
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        jsonData:
          maxLines: 1000

      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        isDefault: false

      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server:80
        isDefault: true

# Lightweight resource limits for local k3d
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Single replica for local dev
replicas: 1

# Persistence for dashboards and alerts (P2-3)
persistence:
  enabled: true
  storageClassName: local-path
  size: 1Gi

# Service type
service:
  type: ClusterIP
  port: 3000
