config:
  spec:
    destination:
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/ankurmathur01nagarro/nagp-ecommerce
      targetRevision: HEAD

argocd-apps:
  projects:
    nagp-ecom:
      namespace: argocd
      description: "Microservice applications"
      destinations:
        - name: defaultCluster
          namespace: nagp-ecom
          server: https://kubernetes.default.svc
        - name: defaultCluster
          namespace: cert-manager
          server: https://kubernetes.default.svc
      clusterResourceWhitelist:
        - group: cert-manager.io
          kind: ClusterIssuer
        - group: external-secrets.io
          kind: ClusterSecretStore
        - group: rbac.authorization.k8s.io
          kind: ClusterRole
        - group: rbac.authorization.k8s.io
          kind: ClusterRoleBinding
      sourceRepos:
        - '*'
    observability:
      namespace: argocd
      description: "Observability stack with security isolation"
      destinations:
        - name: defaultCluster
          namespace: observability
          server: https://kubernetes.default.svc
        - name: defaultCluster
          namespace: istio-system
          server: https://kubernetes.default.svc
        - name: defaultCluster
          namespace: '*'
          server: https://kubernetes.default.svc
      clusterResourceWhitelist:
        - group: ''
          kind: Namespace
        - group: rbac.authorization.k8s.io
          kind: ClusterRole
        - group: rbac.authorization.k8s.io
          kind: ClusterRoleBinding
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
      sourceRepos:
        - '*'
    cert-manager:
      namespace: argocd
      description: "Certification Manager for managing TLS certificates"
      destinations:
        - name: defaultCluster
          namespace: '*'
          server: https://kubernetes.default.svc
      clusterResourceWhitelist:
        - group: ''
          kind: Namespace
        - group: rbac.authorization.k8s.io
          kind: ClusterRole
        - group: rbac.authorization.k8s.io
          kind: ClusterRoleBinding
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
        - group: apiregistration.k8s.io
          kind: APIService
        - group: cert-manager.io
          kind: ClusterIssuer
      sourceRepos:
        - '*'

  applications:
    cert-manager-webhook-duckdns:
      namespace: argocd
      additionalAnnotations:
        argocd.argoproj.io/sync-wave: "1"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      project: cert-manager
      sources:
        - repoURL: https://github.com/ebrianne/cert-manager-webhook-duckdns
          targetRevision: master
          path: deploy/cert-manager-webhook-duckdns
          helm:
            valueFiles:
              - $values/deployment/scripts/deployment/cert-manager/values.cert-manager.yaml
        - repoURL: https://github.com/ankurmathur01nagarro/nagp-ecommerce
          targetRevision: HEAD
          ref: values
        - repoURL: https://github.com/ankurmathur01nagarro/nagp-ecommerce
          targetRevision: HEAD
          path: deployment/scripts/deployment/cert-manager/overlays/local
      destination:
        server: https://kubernetes.default.svc
        namespace: cert-manager
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          prune: true
          selfHeal: true
    nagp-ecom-infrastructure:
      namespace: argocd
      additionalAnnotations:
        argocd.argoproj.io/sync-wave: "3"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      project: nagp-ecom
      source:
        repoURL: https://github.com/ankurmathur01nagarro/nagp-ecommerce
        targetRevision: HEAD
        path: deployment/scripts/deployment/common-infra/overlays/local
      destination:
