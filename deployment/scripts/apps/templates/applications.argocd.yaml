{{/*
  ======================================================================
  1. Microservice applications (single-source, Git path-based)
  ======================================================================
*/}}
{{- range $idx, $app := .Values.applications }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $app.name | quote }}
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  {{- if $app.syncWave }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.syncWave | quote }}
  {{- end }}
spec:
  destination:
    namespace: {{ $app.namespace | default $.Values.project | quote }}
    server: {{ $.Values.config.spec.destination.server | quote }}
  project: {{ $app.project | default $.Values.project | quote }}
  source:
    path: {{ $app.repoPath | default $app.name | quote }}
    repoURL: {{ $.Values.config.spec.source.repoURL }}
    targetRevision: {{ $.Values.config.spec.source.targetRevision }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
---
{{- end }}
{{/*
  ======================================================================
  2. Helm chart applications (multi-source with $values ref)
     Uses spec.sources (plural) to pull chart from Helm repo
     and values file from the Git repo via $values variable.
  ======================================================================
*/}}
{{- range $idx, $app := .Values.helmApplications }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $app.name | quote }}
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.syncWave | default "1" | quote }}
spec:
  destination:
    namespace: {{ $app.namespace | quote }}
    server: {{ $.Values.config.spec.destination.server | quote }}
  project: {{ $app.project | default $.Values.observability.project | quote }}
  sources:
    # Source 1: Helm chart from external repository
    - chart: {{ $app.chart | quote }}
      repoURL: {{ $app.repoURL | quote }}
      targetRevision: {{ $app.chartVersion | quote }}
      helm:
        valueFiles:
          - {{ printf "$values/%s" $app.valuesFile | quote }}
    # Source 2: Git repo providing the values file via $values ref
    - repoURL: {{ $.Values.config.spec.source.repoURL | quote }}
      targetRevision: {{ $.Values.config.spec.source.targetRevision | quote }}
      ref: values
    {{- if $app.extraSources }}
    {{- range $src := $app.extraSources }}
    - {{ toYaml $src | nindent 6 | trim }}
    {{- end }}
    {{- end }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    {{- if $app.managedNamespaceMetadata }}
      - managedNamespaceMetadata=true
    managedNamespaceMetadata:
      labels:
        {{- toYaml $app.managedNamespaceMetadata.labels | nindent 8 }}
    {{- end }}
    automated:
      prune: true
      selfHeal: true
---
{{- end }}
{{/*
  ======================================================================
  3. Raw YAML applications (single-source, Git path-based, no Helm)
     Used for plain Kubernetes manifests like Istio Telemetry.
  ======================================================================
*/}}
{{- range $idx, $app := .Values.rawApplications }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $app.name | quote }}
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.syncWave | default "0" | quote }}
spec:
  destination:
    namespace: {{ $app.namespace | quote }}
    server: {{ $.Values.config.spec.destination.server | quote }}
  project: {{ $app.project | default $.Values.observability.project | quote }}
  source:
    path: {{ $app.repoPath | quote }}
    repoURL: {{ $.Values.config.spec.source.repoURL }}
    targetRevision: {{ $.Values.config.spec.source.targetRevision }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
---
{{- end }}