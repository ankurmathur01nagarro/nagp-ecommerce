# Cloud overlay — replace democratic-csi NFS class with GCP Filestore (ReadWriteMany).
# Requires the Filestore CSI driver enabled on the GKE cluster:
#   gcloud container clusters update CLUSTER --update-addons=GcpFilestoreCsiDriver=ENABLED
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-product-images
  namespace: nagp-ecom
spec:
  storageClassName: filestore-rwx
  resources:
    requests:
      storage: 20Gi
