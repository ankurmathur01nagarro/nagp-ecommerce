# Cloud overlay — remove shared PVC entirely.
# All product images are served via remote URLs (Pexels, Unsplash, DummyJSON).
# When local image uploads are needed, re-enable with Filestore CSI or GCS FUSE.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-product-images
  namespace: nagp-ecom
$patch: delete
