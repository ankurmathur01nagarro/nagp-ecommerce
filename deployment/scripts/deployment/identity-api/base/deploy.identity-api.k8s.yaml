apiVersion: apps/v1
kind: Deployment
metadata:
  name: nagp-ecom-identity-api
  labels:
    app: nagp-ecom-identity-api
    type: api
    stack: nagp-ecom-api
  namespace: nagp-ecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nagp-ecom-identity-api
      stack: nagp-ecom-api
  template:
    metadata:
      labels:
        app: nagp-ecom-identity-api
        type: api
        stack: nagp-ecom-api
    spec:
      containers:
        - name: nagp-ecom-identity-api
          image: nagp-ecom-identity-api
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Kubernetes
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets-nagp
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: secrets-nagp
                  key: POSTGRES_USERNAME
            - name: ConnectionStrings__Default
              value: "Host=postgres;Port=5432;Database=ecomdb;Username=$(POSTGRES_USERNAME);Password=$(POSTGRES_PASSWORD)"
            - name: ExternalAuth__Google__ClientId
              valueFrom:
                secretKeyRef:
                  name: secrets-nagp
                  key: GOOGLE_CLIENT_ID
            - name: ExternalAuth__Google__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: secrets-nagp
                  key: GOOGLE_CLIENT_SECRET
            - name: ExternalAuth__Google__CallbackUri
              valueFrom:
                configMapKeyRef:
                  name: identity-api-config
                  key: GOOGLE_CALLBACK_URI
            - name: ExternalAuth__PostCallbackBaseUrl
              valueFrom:
                configMapKeyRef:
                  name: identity-api-config
                  key: POST_CALLBACK_BASE_URL
            - name: OpenIddict__Issuer
              valueFrom:
                configMapKeyRef:
                  name: identity-api-config
                  key: HOSTNAME
            - name: OpenIddict__Clients__EcomApi__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: identity-api-secrets
                  key: ECOMAPI_CLIENT_SECRET
            - name: OpenIddict__SigningCertificate__PfxBase64
              valueFrom:
                secretKeyRef:
                  name: identity-api-secrets
                  key: OPENIDDICT_SIGNING_CERT_PFX
            - name: OpenIddict__SigningCertificate__Password
              valueFrom:
                secretKeyRef:
                  name: identity-api-secrets
                  key: OPENIDDICT_SIGNING_CERT_PASSWORD
            - name: OpenIddict__EncryptionCertificate__PfxBase64
              valueFrom:
                secretKeyRef:
                  name: identity-api-secrets
                  key: OPENIDDICT_ENCRYPTION_CERT_PFX
            - name: OpenIddict__EncryptionCertificate__Password
              valueFrom:
                secretKeyRef:
                  name: identity-api-secrets
                  key: OPENIDDICT_ENCRYPTION_CERT_PASSWORD
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.observability.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "ecom-identity-api"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
