apiVersion: v1
kind: Service
metadata:
  name: nagp-ecom-imgproxy
  labels:
    app: nagp-ecom-imgproxy
    type: proxy
    stack: nagp-ecom-api
  namespace: nagp-ecom
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: svc-port-http
  selector:
    app: nagp-ecom-imgproxy
    stack: nagp-ecom-api
