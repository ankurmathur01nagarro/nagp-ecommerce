# Cloud overlay — strip local-storage volume from imgproxy deployment.
# All images served via remote URLs; no shared PVC needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nagp-ecom-imgproxy
  namespace: nagp-ecom
spec:
  template:
    spec:
      containers:
        - name: nagp-ecom-imgproxy
          volumeMounts:
            - name: product-images
              $patch: delete
      volumes:
        - name: product-images
          $patch: delete
