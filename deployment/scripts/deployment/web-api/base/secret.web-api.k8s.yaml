apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-api-secrets
  namespace: nagp-ecom
spec:
  secretStoreRef:
    name: secrets-store
    kind: SecretStore
  data:
    - secretKey: ECOMAPI_CLIENT_SECRET 
      remoteRef:
        key: secret/ECOMAPI-CLIENT-SECRET
  target:
    name: web-api-secrets