apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets-nagp
  namespace: nagp-ecom
spec:
  secretStoreRef:
    name: secrets-store
    kind: SecretStore
  data:
    - secretKey: POSTGRES_USERNAME
      remoteRef:
        key: secret/staging
        property: POSTGRES_USERNAME
    - secretKey: POSTGRES_PASSWORD 
      remoteRef:
        key: secret/staging
        property: POSTGRES_PASSWORD
  target:
    name: secrets-nagp