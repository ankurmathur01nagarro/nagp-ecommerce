# AppProjects are now managed within the argocd-apps chart
# See: deployment/scripts/apps/values.yaml (argocd-apps.projects)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nagp-ecom-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ankurmathur01nagarro/nagp-ecommerce
    targetRevision: HEAD
    path: deployment/scripts/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: nagp-ecom
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
