# Jaeger Helm Chart Configuration - Jaeger v2
#
# Jaeger v2 uses OpenTelemetry Collector architecture internally.
# Configuration is done via the `userconfig` block (OTel Collector-style YAML),
# NOT via v1-style environment variables (which are silently ignored).
#
# Chart: jaegertracing/jaeger (v4.4.6), appVersion: 2.14.1
# Docs: https://www.jaegertracing.io/docs/2.4/configuration/
# Migration: https://www.jaegertracing.io/docs/2.4/migration/

# Jaeger v2 OTel Collector-style configuration
userconfig:
  service:
    extensions: [jaeger_storage, jaeger_query, healthcheckv2]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [jaeger_storage_exporter]
    telemetry:
      resource:
        service.name: jaeger
      metrics:
        level: detailed
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888

  extensions:
    healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133

    jaeger_query:
      storage:
        traces: main_store

    jaeger_storage:
      backends:
        main_store:
          memory:
            max_traces: 5000
          # --- PRODUCTION: Switch to Elasticsearch or BadgerDB ---
          # Elasticsearch:
          #   elasticsearch:
          #     server_urls: ["http://elasticsearch:9200"]
          #     auth:
          #       basic:
          #         username: admin
          #         password: ${env:ES_PASSWORD}
          # BadgerDB (single-node persistent):
          #   badger:
          #     directories:
          #       keys: /badger/key
          #       values: /badger/data
          #     ephemeral: false
          #     ttl:
          #       spans: 72h

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:

  exporters:
    jaeger_storage_exporter:
      trace_storage: main_store

# Jaeger deployment settings (chart schema)
jaeger:
  enabled: true
  replicas: 1
  image:
    repository: jaegertracing/jaeger
    tag: "2.14.1"
    pullPolicy: IfNotPresent
  # Resources
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Security context — image default is UID 10001
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

# Labels
commonLabels:
  app: jaeger
  component: tracing
