apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-default
  namespace: istio-system
spec:
  tracing:
  - providers:
    - name: otel
    # Production: 5% head-based sampling (was 100% for dev)
    # Ref: https://istio.io/latest/docs/reference/config/telemetry/
    randomSamplingPercentage: 5
