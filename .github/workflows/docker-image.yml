name: E-Commerce Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
  image_tag: ${{ github.sha }}
  docker_pat: ${{ secrets.DOCKER_REGISTRY_PAT }}
  
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: actions/setup-node@v6.3.0
      with:
        node-version: 24.x
    - name: Build Identity API
      shell: 'pwsh'
      run: |
        cd ./api/ECOM.Identity.Api
        dotnet build --restore
    - name: Build Database Migration
      shell: 'pwsh'
      run: |
        cd ./api/ECOM.WebApi.MigrationJob
        dotnet build --restore
    - name: Build Web Api
      shell: 'pwsh'
      run: |
        cd ./api/ECOM.WebApi
        dotnet build --restore
  
  build-container-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Docker Login
      uses: docker/login-action@v4.0.0
      with:
        username: ankurmathur01nagarro
        password: ${{ env.docker_pat }}
    
    - name: Build and push Database Migration Docker images
      uses: docker/build-push-action@v7.0.0
      with:
        push: true
        context: ./api
        file: ./api/Dockerfile.migration
        tags: docker.io/ankurmathur01nagarro/nagp-ecom-migration:${{ env.image_tag }},docker.io/ankurmathur01nagarro/nagp-ecom-migration:latest
    
    # Unified image: builds Angular (stage 1) + .NET WebApi (stage 2) in a single Dockerfile.
    # Context is the repo root (src/) so both ui/ and api/ are accessible.
    - name: Build and push Web API Docker images
      uses: docker/build-push-action@v7.0.0
      with:
        push: true
        context: .
        file: ./Dockerfile.webapi
        tags: docker.io/ankurmathur01nagarro/nagp-ecom-webapi:${{ env.image_tag }},docker.io/ankurmathur01nagarro/nagp-ecom-webapi:latest
    
    - name: Build and push Identity API Docker images
      uses: docker/build-push-action@v7.0.0
      with:
        push: true
        context: ./api
        file: ./api/Dockerfile.identity
        tags: docker.io/ankurmathur01nagarro/nagp-ecom-identity-api:${{ env.image_tag }},docker.io/ankurmathur01nagarro/nagp-ecom-identity-api:latest
  release:
    needs: build-container-images
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: philiplehmann/setup-kustomize@v2.2.5
    - name: Update image tags and commit
      shell: 'pwsh'
      run: |
        cd ./deployment/scripts/deployment
        
        Push-Location
        cd web-api/overlays/local
        kustomize edit set image nagp-ecom-migration=*:${{ env.image_tag }} nagp-ecom-webapi=*:${{ env.image_tag }}
        Pop-Location
        
        Push-Location
        cd identity-api/overlays/local
        kustomize edit set image nagp-ecom-identity-api=*:${{ env.image_tag }}
        Pop-Location

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git diff --staged --quiet || git commit -m "chore: update image to ${{ github.sha }}"
        git push
