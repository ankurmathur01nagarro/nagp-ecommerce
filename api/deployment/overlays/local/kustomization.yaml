apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: nagp-ecom
commonAnnotations:
  deployment.environment: local

patches:
  - path: patch.statefulset.postgres.local.yaml

configMapGenerator:
  - name: secrets-nagp
    options:
      disableNameSuffixHash: true
    behavior: replace
    files:
      - .secrets-nagp.env
  - name: identity-api-secrets
    options:
      disableNameSuffixHash: true
    behavior: replace
    files:
      - .secrets-identity-api.env