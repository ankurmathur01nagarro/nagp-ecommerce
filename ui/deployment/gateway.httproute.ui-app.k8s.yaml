apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ingress-nagp-ecom-ui
  labels:
    app: nagp-ecom-ui
    type: gateway-ingress
    stack: nagp-ecom
  namespace: nagp-ecom
spec:
  parentRefs:
    - name: nagp-ecom-gateway
      namespace: nagp-ecom
  hostnames:
    - "ecom.docker.localhost"
    - "localhost"
  rules:
  - name: ui-routes
    matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: nagp-ecom-ui
      namespace: nagp-ecom
      port: 80
